<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <title>Plan for dagen</title>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.2/papaparse.min.js"></script>

  <style>
    :root {
      --main-color: #4a90e2;
    }

    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f8fa;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .header-container {
      width: 95%;
      max-width: 1400px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 40px 0 20px;
      user-select: none;
    }

    #title {
      font-size: 64px;
      color: #333;
      font-weight: bold;
      margin: 0;
    }

    #clock {
      font-size: 64px;
      font-weight: bold;
      color: #333;
      user-select: none;
    }

    .container {
      display: flex;
      justify-content: center;
      gap: 50px;
      width: 95%;
      max-width: 1400px;
    }

    .box {
      background: #fff;
      border: 4px solid var(--main-color);
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      white-space: pre-wrap;
    }

    .box h2 {
      margin: 0 0 25px;
      font-size: 32px;
      text-align: center;
      background-color: var(--main-color);
      color: white;
      padding: 12px;
      border-radius: 15px;
      font-weight: bold;
    }

    #aktiviteter, #maltid {
      font-size: 32px;
      color: #333;
      font-weight: bold;
      line-height: 1.5;
    }

    .aktiviteter-box { flex: 3; min-height: 500px; }
    .maltid-box { flex: 1; min-height: 200px; }

    #alert-screen {
      display: none;
      position: fixed;
      inset: 0;
      background-color: var(--main-color);
      color: white;
      font-size: 190px;
      font-weight: bold;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      animation: blink 2s step-start infinite;
    }

    #prelaunch-screen {
      display: none;
      position: fixed;
      inset: 0;
      background-color: var(--main-color);
      color: white;
      font-size: 100px;
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9998;
      text-align: center;
    }

    @keyframes blink {
      50% { opacity: 0; }
      100% { opacity: 1; }
    }
  </style>
</head>

<body>

<div class="header-container">
  <div id="title">Laster plan...</div>
  <div id="clock">--:--</div>
</div>

<div class="container">
  <div class="box aktiviteter-box">
    <h2>Aktiviteter</h2>
    <div id="aktiviteter">Laster...</div>
  </div>
  <div class="box maltid-box">
    <h2>Dagens måltid</h2>
    <div id="maltid">Laster...</div>
  </div>
</div>

<div id="alert-screen"></div>
<div id="prelaunch-screen">Planen for SFO kommer kl 12:30</div>

<script>
const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSNj8UWFr0I5HTyyfMHJshWrdhD5mBKZkejn8qBKFuV3cMY2E2u92iadgpAg09Sd31m2Qgoz42w4-BN/pub?output=csv';

let currentDay = null;

function updateThemeColor() {
  const colors = {
    'Mandag': '#2e8b57',
    'Tirsdag': '#6a5acd',
    'Onsdag': '#f39c12',
    'Torsdag': '#c0392b',
    'Fredag': '#16a085',
    'Lørdag': '#34495e',
    'Søndag': '#8e44ad'
  };

  const dayNames = ['Søndag','Mandag','Tirsdag','Onsdag','Torsdag','Fredag','Lørdag'];
  const today = dayNames[new Date().getDay()];

  if (today !== currentDay) {
    currentDay = today;
    document.documentElement.style.setProperty('--main-color', colors[today]);
  }
}

function loadPlan() {
  fetch(csvUrl)
    .then(res => res.text())
    .then(csvText => {
      const parsed = Papa.parse(csvText, { header: true });
      const rows = parsed.data;

      const dayNames = ['Søndag','Mandag','Tirsdag','Onsdag','Torsdag','Fredag','Lørdag'];
      const today = dayNames[new Date().getDay()];
      const todayRow = rows.find(row => row.Dag && row.Dag.trim() === today);

      if (todayRow) {
        document.getElementById('title').innerText = `${today} – SFO - plan for dagen`;

        const aktiviteter = todayRow.Aktiviteter
          ? todayRow.Aktiviteter.split(',').map(a => '• ' + a.trim()).join('\n')
          : '';

        document.getElementById('aktiviteter').textContent = aktiviteter;
        document.getElementById('maltid').innerText =
          todayRow['Dagens måltid'] ? todayRow['Dagens måltid'].trim() : '';
      }
    })
    .catch(() => {
      document.getElementById('title').innerText = 'Feil ved lasting av data';
    });
}

function updateClock() {
  const now = new Date();
  document.getElementById('clock').textContent =
    now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

const alertTimes = ["14:30","15:00","15:15","15:30","15:45","16:00"];

function updateAlert() {
  const now = new Date();
  const currentMinutes = now.getHours() * 60 + now.getMinutes();
  const alertScreen = document.getElementById("alert-screen");

  const activeAlert = alertTimes.find(time => {
    const [h, m] = time.split(':').map(Number);
    return Math.abs((h*60+m) - currentMinutes) <= 1;
  });

  if (activeAlert) {
    alertScreen.style.display = "flex";
    alertScreen.textContent = activeAlert;
  } else {
    alertScreen.style.display = "none";
  }
}

function updatePrelaunchScreen() {
  const now = new Date();
  const currentMinutes = now.getHours() * 60 + now.getMinutes();
  const start = 20 * 60;
  const end = 12 * 60 + 30;

  const show = start <= end
    ? currentMinutes >= start && currentMinutes < end
    : currentMinutes >= start || currentMinutes < end;

  document.getElementById("prelaunch-screen").style.display = show ? "flex" : "none";
}

/* ====== STABIL TIME-REFRESH ====== */

let lastRefreshHour = null;

function autoScheduledRefresh() {
  const now = new Date();
  const hour = now.getHours();
  const minutes = now.getMinutes();

  if (minutes === 0 && lastRefreshHour !== hour) {
    lastRefreshHour = hour;
    location.reload();
  }
}

/* ====== START ====== */

updateThemeColor();
loadPlan();
updateClock();
updateAlert();
updatePrelaunchScreen();

setInterval(updateThemeColor, 60 * 1000);
setInterval(loadPlan, 5 * 60 * 1000);
setInterval(updateClock, 1000);
setInterval(updateAlert, 1000);
setInterval(updatePrelaunchScreen, 1000);
setInterval(autoScheduledRefresh, 60 * 1000);

</script>
</body>
</html>
